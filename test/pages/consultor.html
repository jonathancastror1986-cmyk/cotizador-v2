<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultor de OTs — Servicios Informáticos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar"></aside>
  <div class="app-main">
    <div class="app-topbar">
      <div style="display:flex; align-items:center;">
        <button class="app-mobile-toggle" id="mobileNavToggle"><i class="fa-solid fa-bars"></i></button>
        <h1>Consultor de OTs</h1>
      </div>
      <div class="user-box">
        <a href="../legacy-cotizador.html" target="_blank" class="btn-ghost" style="padding:6px 12px; font-size:12px; text-decoration:none; color:var(--ink); background:var(--signal-soft); border-color:var(--signal);">📋 Versión completa (offline)</a>
        <span id="currentUserLabel"></span>
        <span class="status-badge" id="currentUserRole"></span>
        <button type="button" id="logoutBtn" class="btn-ghost" style="padding:6px 12px; font-size:12px;">Salir</button>
      </div>
    </div>
    <div class="app-content">
      <div class="wrap">

        <div class="panel">
          <h2>Buscar cotizaciones</h2>
          <div class="field-row">
            <div class="field"><input type="text" id="consultorSearch" placeholder="Buscar por N° de OT, cliente..."></div>
            <div class="field" style="flex:0 0 160px;">
              <select id="consultorEstadoFilter">
                <option value="">Todos los estados</option>
                <option value="borrador">Borrador</option>
                <option value="enviada">Enviada</option>
                <option value="aceptada">Aceptada</option>
                <option value="rechazada">Rechazada</option>
                <option value="en_espera">En espera</option>
                <option value="cancelada">Cancelada</option>
              </select>
            </div>
            <div class="field" style="flex:0 0 160px;">
              <select id="consultorPagoFilter">
                <option value="">Cualquier forma de pago</option>
                <option value="transferencia">Transferencia</option>
                <option value="efectivo">Efectivo</option>
                <option value="tarjeta_debito">Débito</option>
                <option value="tarjeta_credito">Crédito</option>
                <option value="orden_pago">Orden de pago</option>
              </select>
            </div>
          </div>
          <div id="consultorList" style="margin-top:10px;"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="otDetailModal" style="display:none; position:fixed; inset:0; background:rgba(16,27,51,.5); align-items:center; justify-content:center; z-index:300;">
  <div class="panel" style="max-width:600px; width:100%; margin:20px; max-height:88vh; overflow-y:auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <h2 id="otDetailTitle" style="margin:0;">OT</h2>
      <button type="button" id="closeOtDetailBtn" class="btn-ghost" style="padding:6px 12px;">✕</button>
    </div>
    <div id="otDetailInfo" style="font-size:12.5px; color:var(--muted); margin-bottom:10px;"></div>
    <div id="otDetailBadges" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;"></div>

    <div style="font-weight:600; font-size:13px; margin-bottom:8px;">Ítems</div>
    <div id="otDetailItemsList" style="margin-bottom:14px;"></div>
    <div id="otDetailSubtotalLine" class="totals-line" style="display:none;">
      <span>Subtotal</span><span id="otDetailSubtotalDisplay">$0</span>
    </div>
    <div id="otDetailDiscLine" class="totals-line" style="display:none;">
      <span id="otDetailDiscLabel">Ajuste</span><span id="otDetailDiscDisplay">$0</span>
    </div>
    <div class="totals-line total" style="margin-bottom:16px;">
      <span>Total</span><span id="otDetailTotalDisplay">$0</span>
    </div>

    <div class="field-row">
      <div class="field"><label>Estado</label>
        <select id="otDetailEstado">
          <option value="borrador">Borrador</option>
          <option value="enviada">Enviada</option>
          <option value="aceptada">Aceptada</option>
          <option value="rechazada">Rechazada</option>
          <option value="en_espera">En espera (sector)</option>
          <option value="cancelada">Cancelada</option>
        </select>
      </div>
      <div class="field"><label>Forma de pago</label>
        <select id="otDetailFormaPago">
          <option value="transferencia">Transferencia bancaria</option>
          <option value="efectivo">Efectivo</option>
          <option value="tarjeta_debito">Tarjeta de débito</option>
          <option value="tarjeta_credito">Tarjeta de crédito</option>
          <option value="orden_pago">Orden de pago externa</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <label style="display:flex; align-items:center; gap:6px; font-size:13px;"><input type="checkbox" id="otDetailPaid"> Pagada por el cliente</label>
      <label style="display:flex; align-items:center; gap:6px; font-size:13px;"><input type="checkbox" id="otDetailWorkExecuted"> Trabajo ejecutado</label>
    </div>
    <div class="field" style="max-width:260px;">
      <label>Fecha de compromiso de la OT (visita en terreno)</label>
      <input type="date" id="otDetailFechaCompromiso">
    </div>
    <div class="field" id="otDetailDocStageField" style="display:none;">
      <label>Estado del documento tributario</label>
      <select id="otDetailDocStage">
        <option value="borrador">Borrador (sin declarar)</option>
        <option value="declarado">Declarado ante el SII</option>
        <option value="pagado">IVA pagado</option>
      </select>
    </div>
    <button type="button" id="saveOtDetailBtn" class="btn-primary" style="width:100%; margin-top:8px;">Guardar cambios</button>

    <div style="display:flex; gap:8px; margin-top:8px;">
      <button type="button" id="otGeneratePdfBtn" class="btn-ghost" style="flex:1;">📄 PDF</button>
      <a href="cotizaciones.html" class="btn-ghost" id="otOpenInCotizacionesBtn" style="flex:1; text-align:center; text-decoration:none; color:var(--ink);">✏️ Abrir en Cotizaciones</a>
    </div>
  </div>
</div>

<script src="../js/data/clientes.js"></script>
<script src="../js/data/cotizaciones.js"></script>
<script src="../js/data/tecnicos.js"></script>
<script src="../js/totals.js"></script>
<script src="../js/badges.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/nav.js"></script>
<script>renderSidebar('consultor');</script>
<script src="../js/pages/consultor-page.js"></script>
<script src="../js/auth-guard.js"></script>
</body>
</html>
