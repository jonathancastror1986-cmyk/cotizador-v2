<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil — Portal de clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar"></aside>
  <div class="app-main">
    <div class="app-topbar">
      <div style="display:flex; align-items:center;">
        <button class="app-mobile-toggle" id="mobileNavToggle"><i class="fa-solid fa-bars"></i></button>
        <h1>Mi perfil</h1>
      </div>
      <div class="user-box">
        <span id="currentUserLabel"></span>
        <span class="status-badge" id="currentUserRole"></span>
        <button type="button" id="logoutBtn" class="btn-ghost" style="padding:6px 12px; font-size:12px;">Salir</button>
      </div>
    </div>
    <div class="app-content">
      <div class="wrap">

        <div class="panel">
          <h2>Mis datos de contacto</h2>
          <p style="font-size:12.5px; color:var(--muted); margin-top:0;">
            Mantén tu información actualizada para que podamos contactarte.
          </p>
          <div id="misUbicacionesForms"></div>
        </div>

        <div class="panel">
          <h2>Cambiar contraseña</h2>
          <div class="field" style="margin-top:8px;"><label>Nueva contraseña</label><input type="password" id="nuevaPassword" placeholder="Mínimo 6 caracteres"></div>
          <div class="field" style="margin-top:8px;"><label>Repite la nueva contraseña</label><input type="password" id="nuevaPasswordRepeat" placeholder="Repite la contraseña"></div>
          <button type="button" id="cambiarPasswordBtn" class="btn-primary" style="width:100%; margin-top:16px;">Cambiar contraseña</button>
          <div id="passwordStatus" style="font-size:12px; margin-top:8px; color:var(--signal);"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="../js/toast.js"></script>
<script src="../js/portal-nav.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/data/portal.js"></script>
<script src="../js/pages/portal-perfil-page.js"></script>
</body>
</html>
