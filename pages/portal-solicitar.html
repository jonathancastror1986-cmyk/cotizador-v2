<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitar servicio — Portal de clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar"></aside>
  <div class="app-main">
    <div class="app-topbar">
      <div style="display:flex; align-items:center;">
        <button class="app-mobile-toggle" id="mobileNavToggle"><i class="fa-solid fa-bars"></i></button>
        <h1>Solicitar servicio</h1>
      </div>
      <div class="user-box">
        <span id="currentUserLabel"></span>
        <span class="status-badge" id="currentUserRole"></span>
        <button type="button" id="logoutBtn" class="btn-ghost" style="padding:6px 12px; font-size:12px;">Salir</button>
      </div>
    </div>
    <div class="app-content">
      <div class="wrap">

        <div class="panel">
          <h2>Cuéntanos qué necesitas</h2>
          <p style="font-size:12.5px; color:var(--muted); margin-top:0;">
            Enviamos tu solicitud a Servicios Informáticos, y te contactaremos para confirmar y agendar la visita.
          </p>

          <div class="field" style="margin-top:8px;"><label>Ubicación / sucursal</label>
            <select id="solicitudUbicacion"></select>
          </div>

          <div class="field" style="margin-top:8px;"><label>Describe el problema o servicio que necesitas</label>
            <textarea id="solicitudNotas" rows="4" placeholder="Ej: El computador de recepción no enciende, necesitamos revisión."></textarea>
          </div>

          <div class="field" style="margin-top:8px;"><label>Fecha preferida para la visita (opcional)</label>
            <input type="date" id="solicitudFecha">
          </div>

          <button type="button" id="enviarSolicitudBtn" class="btn-primary" style="width:100%; margin-top:16px;">Enviar solicitud</button>
          <div id="solicitudStatus" style="font-size:12px; margin-top:8px; color:var(--signal);"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="../js/toast.js"></script>
<script src="../js/portal-nav.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/data/portal.js"></script>
<script src="../js/pages/portal-solicitar-page.js"></script>
</body>
</html>
